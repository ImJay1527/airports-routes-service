spring.application.name=airports-routes-service
server.port=${PORT:8082}

# ---------- Database ----------
# Default: in-memory H2 (one independent DB per replica). Use the "postgres" profile for a real DB.
spring.datasource.url=${DB_URL:jdbc:h2:mem:airports;NON_KEYWORDS=VALUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.open-in-view=false

# ---------- Security ----------
# MUST be the same value in all three services.
sidis.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
sidis.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- Distribution ----------
# Other replicas of THIS service (comma-separated base URLs)
airports.peers=${PEERS:}

# ---------- Ops ----------
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
