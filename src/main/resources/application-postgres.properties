# PostgreSQL instead of in-memory H2, with an instance profile: --spring.profiles.active=instance1,postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${airports.db.port:5432}/airports}
spring.datasource.username=${DB_USER:airports}
spring.datasource.password=${DB_PASSWORD:airports}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
