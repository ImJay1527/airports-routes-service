# Lightweight in-memory H2 cluster (no database containers needed).
#
# Usage:
#   docker compose -f docker-compose.h2.yml up --build

services:
  airports-1:
    build: .
    restart: unless-stopped
    ports: ["8082:8082"]
    environment:
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      SPRING_PROFILES_ACTIVE: instance1
      INSTANCE_NAME: instance1
      PORT: 8082
      PEERS: http://airports-2:8082
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5

  airports-2:
    build: .
    restart: unless-stopped
    ports: ["8092:8082"]
    environment:
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      SPRING_PROFILES_ACTIVE: instance2
      INSTANCE_NAME: instance2
      PORT: 8082
      PEERS: http://airports-1:8082
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5
